<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Java Compiler</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f9f9f9; }
    .container { display: flex; flex-wrap: wrap; gap: 20px; }
    textarea { width: 100%; height: 370px; font-family: monospace; font-size: 14px; padding: 10px; border-radius: 6px; border: 1px solid #ccc; }
    .pane { flex: 1 1 45%; display: flex; flex-direction: column; }
    button { margin-right: 5px; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-run { background-color: #28a745; color: #fff; }
    .btn-copy { background-color: #6c757d; color: #fff; }
    .btn-reset { background-color: #ffc107; color: #000; }
    pre { background: #000; color: #0f0; padding: 10px; border-radius: 6px; height: 300px; overflow: auto; }
  </style>
</head>
<body>

<h2>Java Compiler</h2>

<div class="container">
  <!-- Editor -->
  <div class="pane">
    <div style="margin-bottom: 8px;">
      <button class="btn-copy" onclick="copyCode()">Copy</button>
      <button class="btn-reset" onclick="resetCode()">Reset</button>
      <button class="btn-run" onclick="runCode()">Run ▶</button>
    </div>
    <textarea id="code"></textarea>
  </div>

  <!-- Output -->
  <div class="pane">
    <h4>Output:</h4>
    <pre id="output">Click Run ▶ to see output…</pre>
     
  </div>
</div>

</script>
<script>
  const defaultCode = `public class Main {
    public static void main(String[] args) {
        System.out.println("Hello, World!");
    }
}`;

  const codeArea = document.getElementById("code");
  const outputArea = document.getElementById("output");

  function copyCode() {
    codeArea.select();
    document.execCommand("copy");
    alert("Code copied!");
  }

  function resetCode() {
    codeArea.value = defaultCode;
    outputArea.textContent = "";
  }

  //   } catch (err) {

  //   }

async function runCode() {
  outputArea.textContent = "Running...";
  const code = codeArea.value;

  // Extract imports
  const imports = (code.match(/^import\s+.*?;/gm) || []).join("\n");

  // Find all public classes
  const classRegex = /public\s+class\s+([A-Za-z_][A-Za-z0-9_]*)/g;
  const classMatches = [...code.matchAll(classRegex)];

  if (classMatches.length === 0) {
    outputArea.textContent = "❌ Error: No public class found";
    return;
  }

  const files = [];
  let mainClass = null;

  for (const cls of classMatches) {
    const className = cls[1];
    const start = cls.index;
    const braceStart = code.indexOf("{", start);

    let braceCount = 0;
    let end = braceStart;

    for (let i = braceStart; i < code.length; i++) {
      if (code[i] === "{") braceCount++;
      if (code[i] === "}") braceCount--;
      if (braceCount === 0) {
        end = i + 1;
        break;
      }
    }

    const classBody = code.substring(start, end);

    // ✅ Detect REAL main()
    if (/public\s+static\s+void\s+main\s*\(\s*String\s*\[\]\s*args\s*\)/.test(classBody)) {
      mainClass = className;
    }

    files.push({
      name: `${className}.java`,
      content: imports + "\n\n" + classBody
    });
  }

  if (!mainClass) {
    outputArea.textContent = "❌ Error: main() method not found";
    return;
  }

  // ✅ Put real main class FIRST
  files.sort((a, b) =>
    a.name === `${mainClass}.java` ? -1 : 1
  );

  try {
    const response = await fetch("https://emkc.org/api/v2/piston/execute", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        language: "java",
        version: "15.0.2",
        files
      })
    });

    const data = await response.json();
    outputArea.textContent =
      (data.run.stdout || "") +
      (data.run.stderr || "");
  } catch {
    outputArea.textContent = "❌ Error running code";
  }
}



  
</script>

</body>
